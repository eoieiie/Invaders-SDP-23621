# Currency & Economy balance values (GoG - Currency System).
# Edit and save, then restart the game. No Java compilation is required.
# Override location: java -Dinvaders.economy=<path> ...
# A missing or invalid key falls back to the built-in default shown here
# (a warning is logged), so a typo never stops the game.

# --- Coin drops ---
# Chance that a destroyed regular enemy drops a coin, between 0.0 and 1.0.
coin.dropChance=0.10

# --- Night Market ---
# Discount on today's deals, in percent (1-99).
nightMarket.discountPercent=30
# How many shop entries are on sale each day (at least 1).
nightMarket.listingCount=3
